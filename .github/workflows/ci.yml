name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  shell-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Syntax check
        run: bash -n scripts/*.sh tests/*.sh
      - name: Unit tests
        run: |
          chmod +x scripts/*.sh tests/*.sh
          bash tests/test_url_validation.sh
          bash tests/test_treble_patch.sh
          bash tests/test_compatibility.sh
          bash tests/test_layout_normalization.sh
          bash tests/test_source_metadata.sh
          python3 tests/test_official_page_parser.py
      - name: PowerShell launcher syntax
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path scripts/Invoke-PixelStockGSI.ps1),
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_ }
            exit 1
          }
