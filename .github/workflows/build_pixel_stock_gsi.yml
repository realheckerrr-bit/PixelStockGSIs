name: "Build PixelStockGSI"

on:
  workflow_dispatch:
    inputs:
      google_url:
        description: "Optional direct HTTPS URL for a Google Pixel package or official GSI ZIP"
        required: false
        default: ""
        type: string
      sha256:
        description: "Optional SHA-256 matching the direct Google URL"
        required: false
        default: ""
        type: string
      google_page_url:
        description: "Official Android download page used when direct URL/SHA are blank"
        required: false
        default: "https://developer.android.com/about/versions/17/qpr2/download"
        type: string
      device_codename:
        description: "Pixel codename on that page, for example bluejay, panther, or shiba"
        required: false
        default: ""
        type: string
      source_mode:
        description: "Use a Pixel stock system image or Google's official GSI as the base"
        required: true
        default: "pixel_stock"
        type: choice
        options:
          - pixel_stock
          - official_gsi
      output_name:
        description: "Release image base name"
        required: true
        default: "PixelStockGSI"
        type: string
      filesystem:
        description: "Output filesystem"
        required: true
        default: "ext4"
        type: choice
        options:
          - ext4
          - erofs
      target_model:
        description: "Optional device being evaluated; use generic for a cross-device build"
        required: true
        default: "generic"
        type: string
      expected_arch:
        description: "ABI gate for the generated GSI"
        required: true
        default: "arm64"
        type: choice
        options:
          - arm64
          - auto
      publish_release:
        description: "Publish the generated images as a GitHub Release"
        required: true
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  build:
    name: "PixelStockGSI build"
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Resolve official Google package
        env:
          GOOGLE_URL_INPUT: ${{ inputs.google_url }}
          GOOGLE_SHA256_INPUT: ${{ inputs.sha256 }}
          GOOGLE_PAGE_URL: ${{ inputs.google_page_url }}
          DEVICE_CODENAME: ${{ inputs.device_codename }}
          SOURCE_MODE: ${{ inputs.source_mode }}
        run: |
          set -Eeuo pipefail
          case "$SOURCE_MODE" in
            pixel_stock|official_gsi) ;;
            *) echo "Unsupported source_mode: $SOURCE_MODE" >&2; exit 2 ;;
          esac
          if [ "$SOURCE_MODE" = official_gsi ]; then
            test -n "$GOOGLE_URL_INPUT" || { echo "official_gsi requires a direct google_url and sha256" >&2; exit 2; }
            test -n "$GOOGLE_SHA256_INPUT" || { echo "official_gsi requires a direct google_url and sha256" >&2; exit 2; }
            GOOGLE_URL_RESOLVED="$GOOGLE_URL_INPUT"
            GOOGLE_SHA256_RESOLVED="$GOOGLE_SHA256_INPUT"
          elif [ -n "$GOOGLE_URL_INPUT" ] || [ -n "$GOOGLE_SHA256_INPUT" ]; then
            test -n "$GOOGLE_URL_INPUT" || { echo "google_url and sha256 must be supplied together" >&2; exit 2; }
            test -n "$GOOGLE_SHA256_INPUT" || { echo "google_url and sha256 must be supplied together" >&2; exit 2; }
            GOOGLE_URL_RESOLVED="$GOOGLE_URL_INPUT"
            GOOGLE_SHA256_RESOLVED="$GOOGLE_SHA256_INPUT"
          else
            test -n "$DEVICE_CODENAME" || { echo "Provide device_codename when direct URL/SHA are blank" >&2; exit 2; }
            mapfile -t RESOLVED < <(python3 scripts/resolve_official_pixel_image.py "$GOOGLE_PAGE_URL" "$DEVICE_CODENAME")
            test "${#RESOLVED[@]}" -eq 2 || { echo "Official page resolver returned an invalid result" >&2; exit 1; }
            GOOGLE_URL_RESOLVED="${RESOLVED[0]}"
            GOOGLE_SHA256_RESOLVED="${RESOLVED[1]}"
          fi
          echo "GOOGLE_URL=$GOOGLE_URL_RESOLVED" >> "$GITHUB_ENV"
          echo "GOOGLE_SHA256=$GOOGLE_SHA256_RESOLVED" >> "$GITHUB_ENV"
          echo "SOURCE_MODE=$SOURCE_MODE" >> "$GITHUB_ENV"
          echo "Resolved official package: $(basename "$GOOGLE_URL_RESOLVED")"

      - name: Install image tools
        run: bash scripts/install_dependencies.sh

      - name: Build and patch selected Google system image
        env:
          OUTPUT_NAME: ${{ inputs.output_name }}
          FILESYSTEM: ${{ inputs.filesystem }}
          TARGET_MODEL: ${{ inputs.target_model }}
          EXPECTED_ARCH: ${{ inputs.expected_arch }}
          SOURCE_MODE: ${{ inputs.source_mode }}
          DOWNLOAD_DEVICE_HINT: ${{ inputs.device_codename }}
        run: |
          chmod +x scripts/*.sh
          bash scripts/build_pixel_stock_gsi.sh \
            "$GOOGLE_URL" \
            "$OUTPUT_NAME" \
            "$FILESYSTEM" \
            "$GITHUB_WORKSPACE/workspace" \
            "$GOOGLE_SHA256" \
            "$TARGET_MODEL" \
            "$EXPECTED_ARCH" \
            "$SOURCE_MODE" \
            "$DOWNLOAD_DEVICE_HINT"

      - name: Create checksums and release metadata
        id: metadata
        env:
          OUTPUT_NAME: ${{ inputs.output_name }}
          FILESYSTEM: ${{ inputs.filesystem }}
          TARGET_MODEL: ${{ inputs.target_model }}
          EXPECTED_ARCH: ${{ inputs.expected_arch }}
          SOURCE_MODE: ${{ inputs.source_mode }}
          DOWNLOAD_DEVICE_HINT: ${{ inputs.device_codename }}
        run: |
          set -Eeuo pipefail
          OUTPUT_DIR="$GITHUB_WORKSPACE/workspace/output"
          IMAGE_XZ=$(find "$OUTPUT_DIR" -maxdepth 1 -type f -name '*.img.xz' -print -quit)
          IMAGE_GZ=$(find "$OUTPUT_DIR" -maxdepth 1 -type f -name '*.img.gz' -print -quit)
          test -n "$IMAGE_XZ" && test -n "$IMAGE_GZ"
          (cd "$OUTPUT_DIR" && sha256sum *.img.xz *.img.gz > SHA256SUMS.txt)

          SOURCE_PROPERTIES_FILE="$GITHUB_WORKSPACE/workspace/source-system-properties.txt"
          source_prop() {
            local key="$1"
            awk -F= -v wanted="$key" '$1 == wanted { sub(/^[^=]*=/, ""); print; exit }' "$SOURCE_PROPERTIES_FILE"
          }
          RAW_BYTES=$(xz --robot --list "$IMAGE_XZ" | awk -F '\t' '$1 == "totals" { print $5 }')
          [ -n "$RAW_BYTES" ] || RAW_BYTES=0
          RELEASE_TAG="v$(date -u +%Y.%m.%d-%H%M%S)-${GITHUB_RUN_ID}"
          RELEASE_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$RELEASE_TAG"
          TOOL_VERSION=$(cat VERSION)
          SOURCE_SYSTEM_SHA=$(cat "$GITHUB_WORKSPACE/workspace/source-system.sha256")
          SOURCE_FILESYSTEM=$(cat "$GITHUB_WORKSPACE/workspace/source-filesystem.txt")
          SOURCE_PROVENANCE=$(cat "$GITHUB_WORKSPACE/workspace/source-provenance.txt")
          SOURCE_PROPERTIES=$(cat "$GITHUB_WORKSPACE/workspace/source-system-properties.txt")
          SOURCE_MODE_VALUE="${SOURCE_MODE:-pixel_stock}"
          case "$SOURCE_MODE_VALUE" in
            pixel_stock)
              SOURCE_DESCRIPTION="an unofficial Pixel-derived, GSI-shaped system image, not an AOSP-built universal GSI or a Google-signed Pixel image."
              ;;
            official_gsi)
              SOURCE_DESCRIPTION="an unofficial derivative rebuilt from Google's official GSI base; it is not a Google-signed image."
              ;;
            *)
              echo "Unsupported source mode in release metadata: $SOURCE_MODE_VALUE" >&2
              exit 2
              ;;
          esac
          SOURCE_DEVICE=$(source_prop ro.product.device)
          SOURCE_SYSTEM_DEVICE=$(source_prop ro.product.system.device)
          SOURCE_MODEL=$(source_prop ro.product.model)
          SOURCE_SYSTEM_MODEL=$(source_prop ro.product.system.model)
          ANDROID_VERSION=$(source_prop ro.build.version.release)
          ANDROID_SDK=$(source_prop ro.build.version.sdk)
          BUILD_ID=$(source_prop ro.build.id)
          BUILD_FINGERPRINT=$(source_prop ro.build.fingerprint)
          SECURITY_PATCH=$(source_prop ro.build.version.security_patch)
          IMAGE_MODE=$(cat "$GITHUB_WORKSPACE/workspace/image-mode.txt")
          CHECKSUMS=$(cat "$OUTPUT_DIR/SHA256SUMS.txt")
          COMPATIBILITY_REPORT=$(cat "$OUTPUT_DIR/compatibility-report.txt")

          cat > "$OUTPUT_DIR/release-notes.md" <<EOF
          ## PixelStockGSI's

          This release was built from the official Google package URL supplied
          to the workflow and verified with the SHA-256 recorded below.

          - Source URL: $GOOGLE_URL
          - Source package SHA-256: \`$GOOGLE_SHA256\`
          - Source mode: \`$SOURCE_MODE_VALUE\`
          - Output filesystem: \`$FILESYSTEM\`
          - Target model hint: \`$TARGET_MODEL\`
          - ABI gate: \`$EXPECTED_ARCH\`
          - Workflow run: [$GITHUB_RUN_ID]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)

          ### Build information

          <details>
          <summary>Show complete build metadata</summary>

          - Tool version: \`$TOOL_VERSION\`
          - Source package SHA-256: \`$GOOGLE_SHA256\`
          - Extracted source system SHA-256: \`$SOURCE_SYSTEM_SHA\`
          - Source filesystem: \`$SOURCE_FILESYSTEM\`
          - Output filesystem: \`$FILESYSTEM\`
          - Output image size before compression: \`$RAW_BYTES bytes\`
          - Target model hint: \`$TARGET_MODEL\`
          - Requested ABI: \`$EXPECTED_ARCH\`
          - Original source device: \`$SOURCE_DEVICE\`
          - Original system device: \`$SOURCE_SYSTEM_DEVICE\`
          - Original source model: \`$SOURCE_MODEL\`
          - Original system model: \`$SOURCE_SYSTEM_MODEL\`
          - Android version: \`$ANDROID_VERSION\` (SDK \`$ANDROID_SDK\`)
          - Build ID: \`$BUILD_ID\`
          - Build fingerprint: \`$BUILD_FINGERPRINT\`
          - Security patch: \`$SECURITY_PATCH\`
          - Image mode: \`$IMAGE_MODE\`
          - Commit: \`$GITHUB_SHA\`
          - Workflow run: [$GITHUB_RUN_ID]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)
          - Release: [$RELEASE_TAG]($RELEASE_URL)

          Checksums:

          <pre>$CHECKSUMS</pre>

          </details>

          ### Downloaded device and source properties

          The device identity below is captured from the downloaded package
          and the unmodified system properties before PixelStockGSI's patch is
          applied. The later generic markers are not used as the source identity.

          <details>
          <summary>Show downloaded-device provenance and original system properties</summary>

          <pre>$SOURCE_PROVENANCE</pre>

          <pre>$SOURCE_PROPERTIES</pre>

          </details>

          ### Compatibility preflight

          <details>
          <summary>Show automated compatibility report</summary>

          <pre>$COMPATIBILITY_REPORT</pre>

          </details>

          ### Assets

          - \`.img.xz\`: sparse system image for the device-specific GSI flashing method.
          - \`.img.gz\`: raw system image compressed for supported DSU sideloaders.
          - \`compatibility-report.txt\`: automated gate plus device-specific warnings.
          - \`SHA256SUMS.txt\`: download verification checksums.

          ### Before flashing

          This release is $SOURCE_DESCRIPTION
          Keep the target device's matching vendor, kernel/modules, DTB,
          boot/vendor_boot, vbmeta policy, product/system_ext behavior, and
          recovery procedure. The builder cannot make one system image boot on
          every device or supply hardware drivers. An unlocked, Treble-capable
          device and a device-specific installation method are required.
          EOF

          echo "RELEASE_TAG=$RELEASE_TAG" >> "$GITHUB_ENV"
          echo "OUTPUT_DIR=$OUTPUT_DIR" >> "$GITHUB_ENV"

      - name: Upload workflow artifact
        if: ${{ inputs.publish_release }}
        uses: actions/upload-artifact@v4
        with:
          name: "${{ inputs.output_name }}-PixelStockGSI"
          path: |
            workspace/output/*.img.xz
            workspace/output/*.img.gz
            workspace/output/SHA256SUMS.txt
            workspace/output/compatibility-report.txt
          retention-days: 14

      - name: Publish GitHub Release
        if: ${{ inputs.publish_release }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: "PixelStockGSI's - ${{ inputs.output_name }}"
          body_path: workspace/output/release-notes.md
          files: |
            workspace/output/*.img.xz
            workspace/output/*.img.gz
            workspace/output/SHA256SUMS.txt
            workspace/output/compatibility-report.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
